# docker-compose.yml — RCA (container เดียว) + phpMyAdmin
#
# ── แผนผังพอร์ตบนเครื่องนี้ ───────────────────────────────────────────────────
#   8080  km-system (แอป)                    ← ของเดิม ไม่แตะ
#   8088  RCA (แอป)                          ← ตัวนี้
#   8089  phpMyAdmin                         ← ตัวนี้
#   3306  MySQL ตัวอื่นที่ใช้อยู่แล้ว          ← ของเดิม ไม่แตะ
#   3307  MySQL ของ km                       ← ของเดิม ไม่แตะ (RCA ใช้ตัวนี้ร่วม)
#   3308  ว่าง                                ← ไม่ได้ใช้ ปล่อยว่างไว้
#
# RCA ไม่เปิดพอร์ต MySQL ของตัวเองเลย เพราะใช้ MySQL ตัวเดียวกับ km ตามสเปกข้อ 3
# (แยกแค่ database: km ใช้ของมัน RCA ใช้ database ชื่อ `rca`)
#
# 3307 คือพอร์ตที่ km "เปิดออกมาบน host" — แต่ container ใน network เดียวกัน
# คุยกันตรงๆ ที่พอร์ตภายใน 3306 ผ่านชื่อ service จึงไม่ต้องใช้ 3307 ในไฟล์นี้
#
# หาชื่อ network และชื่อ service ของ km:
#   docker network ls                                     → KM_NETWORK
#   docker compose -f <km>/docker-compose.yml ps          → DB_HOST

services:
  rca:
    build: .
    image: rca:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:3000"
    environment:
      # host = ชื่อ service MySQL ของ km, port = 3306 (พอร์ตภายใน ไม่ใช่ 3307)
      #   mysql://rca:xxx@mysql:3306/rca
      DATABASE_URL: ${DATABASE_URL}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DOCUMENT_STORAGE_DIR: /app/data/documents
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      TZ: Asia/Bangkok
    volumes:
      # ไฟล์ DOCX ที่อัปโหลดอยู่นอก container — ลบ container แล้วไฟล์ไม่หาย
      - ./data/documents:/app/data/documents
    networks:
      - km

  # ── phpMyAdmin — หน้าจอจัดการฐานข้อมูล ───────────────────────────────────────
  # เห็นทุก database บน MySQL ของ km (รวม db ของ km เอง) ตามสิทธิ์ของ user ที่ล็อกอิน
  # ถ้า km มี phpMyAdmin อยู่แล้ว ไม่ต้องรัน service นี้: `docker compose up -d rca`
  #
  # ⚠️ พอร์ตนี้เปิดเฉพาะในวง LAN ของโรงพยาบาลเท่านั้น ห้าม forward ออกอินเทอร์เน็ต
  #    มันคือทางเข้า DB เต็มสิทธิ์ ไม่มี rate limit ไม่มี 2FA และล็อกอินผิดกี่ครั้งก็ได้
  #    ถ้าเครื่องนี้มี public IP ให้ผูกพอร์ตไว้กับ LAN interface เท่านั้น เช่น
  #      ports: ["192.168.x.x:8089:80"]
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8089}:80"
    environment:
      PMA_HOST: ${DB_HOST:?ต้องตั้ง DB_HOST เป็นชื่อ service MySQL ของ km ใน .env}
      PMA_PORT: ${DB_PORT:-3306}
      # เผื่อ import ไฟล์ .sql ก้อนใหญ่ (default ของ image คือ 2M ซึ่งน้อยไป)
      UPLOAD_LIMIT: ${PMA_UPLOAD_LIMIT:-64M}
      TZ: Asia/Bangkok
    networks:
      - km

networks:
  # network ที่ km สร้างไว้แล้ว — external: true แปลว่า compose นี้ไม่สร้างเอง
  # ถ้าชื่อผิดจะขึ้น error ตั้งแต่ `docker compose up` ไม่ใช่ไปพังตอนต่อ DB
  km:
    external: true
    name: ${KM_NETWORK:?ต้องตั้ง KM_NETWORK เป็นชื่อ docker network ของ km ใน .env}
