# docker-compose.yml — RCA ยืนด้วยตัวเองทั้ง stack
#
# แอป + MySQL + phpMyAdmin ของ RCA เอง ไม่แตะ km และไม่ต่อ network ของ km เลย
# `docker compose up -d` ครั้งแรก MySQL จะสร้าง database + user ให้อัตโนมัติ
# ตามค่าใน .env — ไม่ต้องล็อกอิน root ไปรัน SQL เอง
#
# ── พอร์ตที่มีเจ้าของแล้วบนเครื่องนี้ อย่าไปชน ─────────────────────────────────
#   3000 · 3100 · 3300 · 3500        ระบบอื่น
#   3001 km api · 8080 phpMyAdmin ของ km · 3307 MySQL ของ km · 6380 Redis ของ km
#
# ── ของ RCA ──────────────────────────────────────────────────────────────────
#   3800  RCA (แอป)
#   8089  phpMyAdmin ของ RCA
#   3308  MySQL ของ RCA
#
# หมายเหตุ: สเปกข้อ 3 เขียนไว้ว่าใช้ MySQL ตัวเดียวกับ km-system
# ตรงนี้เลือกแยก instance ตามที่ตกลงกันภายหลัง เพื่อให้ RCA ไม่ผูกกับ stack ของ km

services:
  rca:
    build: .
    image: rca:latest
    restart: unless-stopped
    ports:
      # 3800 บน host → 3000 ในคอนเทนเนอร์ (พอร์ตภายในเป็น default ของ Next.js
      # ไม่ชนกับใครเพราะอยู่คนละ network namespace)
      - "${APP_PORT:-3800}:3000"
    environment:
      # host = "mysql" คือชื่อ service ข้างล่าง, port 3306 คือพอร์ตภายใน
      # (ไม่ใช่ 3308 ที่เปิดออกมาบน host)
      DATABASE_URL: mysql://${MYSQL_USER:-rca}:${MYSQL_PASSWORD:?ต้องตั้ง MYSQL_PASSWORD ใน .env}@mysql:3306/${MYSQL_DATABASE:-rca}

      # ── auth: ใช้บัญชีเดียวกับระบบ dashboard (ppc-hos-10667) ──
      AUTH_DB_HOST: ${AUTH_DB_HOST}
      AUTH_DB_PORT: ${AUTH_DB_PORT:-3306}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASS: ${AUTH_DB_PASS}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-ppchos}
      JWT_SECRET: ${JWT_SECRET:?ต้องตั้ง JWT_SECRET ใน .env (openssl rand -hex 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      # ── HOSxP (อ่านอย่างเดียว) — ใช้ดึงรายการแผนก/สิทธิมาเป็นตัวเลือกใน dropdown
      # ⚠️ ทุกตัวต้อง default เป็นค่าว่าง ห้ามใส่ค่าสำเร็จรูป
      #    เพราะแอปจะถือว่า "ไม่ได้ตั้ง" แล้วไปใช้ค่าของ AUTH_DB_* ต่อให้เอง
      #    (HOSxP กับฐานผู้ใช้อยู่เครื่องเดียวกัน) — ถ้าใส่ :-false / :-hos ไว้
      #    จะกลายเป็นสั่งปิดและล็อกชื่อฐานทั้งที่ผู้ใช้ไม่ได้ตั้งอะไรเลย
      HOSXP_ENABLED: ${HOSXP_ENABLED:-}
      HOSXP_DB_HOST: ${HOSXP_DB_HOST:-}
      HOSXP_DB_PORT: ${HOSXP_DB_PORT:-}
      HOSXP_DB_USER: ${HOSXP_DB_USER:-}
      HOSXP_DB_PASS: ${HOSXP_DB_PASS:-}
      HOSXP_DB_NAME: ${HOSXP_DB_NAME:-}
      HOSXP_CACHE_TTL_SEC: ${HOSXP_CACHE_TTL_SEC:-3600}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DOCUMENT_STORAGE_DIR: /app/data/documents
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      TZ: Asia/Bangkok
    volumes:
      # ไฟล์ DOCX ที่อัปโหลดอยู่นอก container — ลบ container แล้วไฟล์ไม่หาย
      - ./data/documents:/app/data/documents
    depends_on:
      # service_started ไม่ใช่ service_healthy — ตัวรอ DB จริงคือ retry loop ใน
      # docker-entrypoint.sh ถ้าผูกกับ healthcheck แล้ว healthcheck เพี้ยน/ช้าเกิน
      # timeout จะทำให้ทั้ง stack ขึ้นไม่ได้เลย ("dependency failed to start")
      # ทั้งที่ MySQL อาจใช้ได้อยู่ — เอา failure mode นั้นออก
      mysql:
        condition: service_started

  # ── MySQL ของ RCA ────────────────────────────────────────────────────────────
  # image mysql สร้าง MYSQL_DATABASE + MYSQL_USER ให้เองตอนบูตครั้งแรก
  # และ grant สิทธิ์ทั้งหมดบน database นั้นให้ user นั้นโดยอัตโนมัติ
  #
  # ⚠️ ค่าพวกนี้มีผลเฉพาะ "ตอนสร้าง volume ครั้งแรก" เท่านั้น
  #    ถ้าแก้รหัสทีหลังแล้วอยากให้มีผล ต้อง ALTER USER เอง หรือลบ volume แล้วเริ่มใหม่
  #    (docker compose down -v — ข้อมูลหายหมด)
  mysql:
    image: mysql:8
    restart: unless-stopped
    ports:
      # 3308 บน host — 3306 เป็นของตัวอื่น, 3307 เป็นของ km
      - "${DB_PUBLISH_PORT:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?ต้องตั้ง MYSQL_ROOT_PASSWORD ใน .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rca}
      MYSQL_USER: ${MYSQL_USER:-rca}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?ต้องตั้ง MYSQL_PASSWORD ใน .env}
      TZ: Asia/Bangkok
    command:
      # ภาษาไทยต้องเป็น utf8mb4 — DB นี้เป็นของแอปเราเอง ไม่ใช่ HOSxP (ที่ใช้ tis620)
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # ใช้แสดงสถานะเท่านั้น — ตัวรอ DB จริงคือ retry loop ใน docker-entrypoint.sh
      #
      # -h 127.0.0.1 (ไม่ใช่ localhost): บังคับต่อผ่าน TCP
      # ถ้าใช้ localhost ตัว client จะไปเข้า unix socket ซึ่งช่วงที่ image กำลัง
      # init ก็มีอยู่แล้ว (temp server รันด้วย --skip-networking) จะได้ healthy
      # ก่อนที่ MySQL จะพร้อมรับ connection จริง
      #
      # ต้องเป็น CMD-SHELL — CMD แบบ exec ไม่ขยายตัวแปร $MYSQL_ROOT_PASSWORD ให้
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 10s
      timeout: 10s
      # budget = start_period 180s + 40×10s ≈ 10 นาที
      # เผื่อเครื่องที่ดิสก์ช้า — MySQL init ครั้งแรกบน Docker Desktop/Windows
      # ใช้เวลาได้หลายนาที ค่าเดิม (~150 วิ) น้อยเกินไป
      retries: 40
      start_period: 180s

  # ── phpMyAdmin ของ RCA ───────────────────────────────────────────────────────
  # ⚠️ เปิดเฉพาะวง LAN โรงพยาบาล ห้าม forward ออกอินเทอร์เน็ต
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8089}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      # เผื่อ import .sql ก้อนใหญ่ (default ของ image คือ 2M)
      UPLOAD_LIMIT: ${PMA_UPLOAD_LIMIT:-64M}
      TZ: Asia/Bangkok
    depends_on:
      - mysql

volumes:
  mysql_data:
